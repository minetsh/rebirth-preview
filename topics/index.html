            const showing = password.type === "password";
            password.type = showing ? "text" : "password";
            toggle.textContent = showing ? "隐藏" : "显示";
            toggle.setAttribute(
              "aria-label",
              showing ? "隐藏密码" : "显示密码",
            );
            toggle.setAttribute("aria-pressed", String(showing));
          });
          password.addEventListener("input", function () {
            password.removeAttribute("aria-invalid");
            error.textContent = "";
          });
          form.addEventListener("submit", async function () {
            if (busy || !ready || !password.value) return;
            error.textContent = "";
            password.removeAttribute("aria-invalid");
            setBusy(true, "正在此浏览器中解密，密码不会发送到服务器。");
            try {
              const result = await staticrypt.handleDecryptionOfPage(
                password.value,
                remember.checked,
              );
              if (!result.isSuccessful) {
                password.setAttribute("aria-invalid", "true");
                showError(
                  "密码不正确，请检查大小写后重试，或向项目所有者确认密码。",
                );
                password.focus();
                password.select();
              }
            } catch {
              if (!replaced)
                showError(
                  "本地解密未完成。请刷新后重试，或使用最新版浏览器通过 HTTPS / localhost 打开。",
                );
            } finally {
              if (!replaced) setBusy(false);
            }
          });

          // The saved value is a decryption key. Only use it with a valid, unexpired opt-in timestamp.
          let storedKey = null;
          try {
            const expiration = Number(localStorage.getItem(expirationKey));
            storedKey = localStorage.getItem(passphraseKey);
            if (!Number.isFinite(expiration) || expiration <= Date.now()) {
              clearRemembered();
              storedKey = null;
            }
          } catch {
            rememberLabel.hidden = true;
            remember.checked = false;
            showError(
              "此浏览器不允许本地存储，无法记住设备。仍可输入密码解密。",
            );
          }
          if (storedKey) {
            setBusy(true, "正在使用此设备保存的密钥解密…");
            try {
              const result = await staticrypt.handleDecryptionOfPageFromHash(
                storedKey,
                false,
              );
              if (!result.isSuccessful) {
                clearRemembered();
                showError("此设备保存的密钥已失效，请重新输入访问密码。");
              }
            } catch {
              clearRemembered();
              if (!replaced)
                showError("无法使用此设备保存的密钥，请重新输入访问密码。");
            }
          }
          if (!replaced) setBusy(false);
        } catch (failure) {
          ready = false;
          setBusy(false);
          if (failure.message === "webcrypto-unavailable") {
            showError(
              "当前环境无法使用 Web Crypto。请通过 HTTPS 或 localhost 打开，并使用最新版 Safari、Chrome、Edge 或 Firefox。",
            );
          } else {
            showError(
              "解密程序未能加载，请刷新页面重试；仍无法打开时，请联系项目所有者重新生成预览。",
            );
          }
        }
      })();
    </script>
  </body>
</html>
